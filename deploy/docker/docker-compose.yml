version: "3.9"
services:
  decision-service:
    build: ../../control-plane/decision-service
    expose: ["8001"]
    environment:
      CG_PRODUCTION: ${CG_PRODUCTION:-1}
      DECISION_SERVICE_API_KEY: ${DECISION_SERVICE_API_KEY:?set DECISION_SERVICE_API_KEY in the deployment environment}
    networks: [cg-backend]
  api:
    build: ../../control-plane/api
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DECISION_SERVICE_URL: http://decision-service:8001
      DECISION_SERVICE_API_KEY: ${DECISION_SERVICE_API_KEY:?set DECISION_SERVICE_API_KEY in the deployment environment}
      CG_ALLOWED_ORIGINS: ${CG_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      CYBERGUARDIAN_API_KEY: ${CYBERGUARDIAN_API_KEY:?set CYBERGUARDIAN_API_KEY in the deployment environment}
      CG_DASHBOARD_API_KEY: ${CG_DASHBOARD_API_KEY:?set CG_DASHBOARD_API_KEY (unique 32+ random bytes)}
      CG_NAD_API_KEY: ${CG_NAD_API_KEY:?set CG_NAD_API_KEY (unique 32+ random bytes)}
      CG_OPERATOR_ASSERTION_SECRET: ${CG_OPERATOR_ASSERTION_SECRET:?set CG_OPERATOR_ASSERTION_SECRET (32+ random bytes)}
      CG_DATA_DIR: /app/data
      CG_PRODUCTION: ${CG_PRODUCTION:-1}
      CG_REQUIRE_AGENT_IDENTITY: ${CG_REQUIRE_AGENT_IDENTITY:-1}
    volumes:
      - ${CG_DATA_HOST_DIR:-../../data}:/app/data
    depends_on: [decision-service]
    networks: [cg-backend]
  nad-processor:
    build: ../../control-plane/nad-processor
    environment:
      API_URL: http://api:8080
      CG_NAD_API_KEY: ${CG_NAD_API_KEY:?set CG_NAD_API_KEY (unique 32+ random bytes)}
    depends_on: [api]
    networks: [cg-backend]
  dashboard:
    build: ../../dashboard
    ports: ["127.0.0.1:3000:3000"]
    environment:
      API_URL: http://api:8080
      CG_DASHBOARD_API_KEY: ${CG_DASHBOARD_API_KEY:?set CG_DASHBOARD_API_KEY (unique 32+ random bytes)}
      CG_OPERATOR_ASSERTION_SECRET: ${CG_OPERATOR_ASSERTION_SECRET:?set CG_OPERATOR_ASSERTION_SECRET (32+ random bytes)}
      CG_DATA_DIR: /app/data
      CG_PRODUCTION: ${CG_PRODUCTION:-1}
      CG_COOKIE_SECURE: ${CG_COOKIE_SECURE:-1}
      CG_TRUSTED_PROXY_IPS: ${CG_TRUSTED_PROXY_IPS:-}
    volumes:
      - ${CG_DATA_HOST_DIR:-../../data}:/app/data
    depends_on: [api]
    networks: [cg-backend]

networks:
  cg-backend:
    driver: bridge
