name: CI
on:
  push:
    branches: [main, "r2-*"]
  pull_request:
    branches: [main, "r2-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dashboard/requirements.txt -r control-plane/decision-service/requirements.txt pytest
      - name: Assemble and verify canonical gateway
        run: |
          python control-plane/api/assemble_main.py
          test -s control-plane/api/main_full.py
      - name: Run automated tests
        run: python -m pytest tests/ -q --tb=short
      - name: Compile application modules
        run: |
          python -m py_compile control-plane/api/main.py control-plane/api/operator_context.py control-plane/api/service_auth.py control-plane/api/runtime_paths.py control-plane/api/agent_credentials.py control-plane/api/command_signing.py control-plane/api/agent_identity.py agents/linux-ebpf/agent.py agents/linux-ebpf/containment.py agents/linux-ebpf/offline_queue.py agents/linux-ebpf/command_crypto.py control-plane/decision-service/main.py control-plane/nad-processor/main.py dashboard/main.py dashboard/auth.py scripts/enroll_agent.py scripts/test_containment_namespace.py

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --pull -t cyberguardian-api:ci control-plane/api
      - name: Start container smoke test
        run: |
          docker run -d --name cg-api -p 18080:8080 cyberguardian-api:ci
          for i in $(seq 1 30); do
            code=$(curl --connect-timeout 1 --max-time 2 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/health || true)
            if [ "$code" = "200" ]; then
              echo "API health check passed"
              exit 0
            fi
            sleep 1
          done
          docker logs cg-api || true
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f cg-api || true

  compose-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot isolated production-mode Compose stack
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d)"
          PROJECT="cg-compose-ci"
          cleanup() {
            (cd deploy/docker && docker compose -p "$PROJECT" down --volumes --remove-orphans) || true
            rm -rf "$DATA_DIR"
          }
          trap cleanup EXIT
          export CG_DATA_HOST_DIR="$DATA_DIR"
          export CG_PRODUCTION=1
          export CG_REQUIRE_AGENT_IDENTITY=1
          export CG_COOKIE_SECURE=1
          export CG_TRUSTED_PROXY_IPS=""
          export CG_ALLOWED_ORIGINS="https://testserver"
          export CYBERGUARDIAN_API_KEY="admin-$(openssl rand -hex 32)"
          export CG_DASHBOARD_API_KEY="dashboard-$(openssl rand -hex 32)"
          export CG_NAD_API_KEY="nad-$(openssl rand -hex 32)"
          export CG_OPERATOR_ASSERTION_SECRET="$(openssl rand -hex 32)"
          export DECISION_SERVICE_API_KEY="decision-$(openssl rand -hex 32)"
          python3 - "$DATA_DIR" "$CYBERGUARDIAN_API_KEY" <<'PY'
          import base64, hashlib, json, secrets, sys
          from pathlib import Path
          data = Path(sys.argv[1])
          password = "Compose-CI-Integration-Password-2026!"
          salt = secrets.token_bytes(16)
          rounds = 310_000
          digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, rounds)
          encode = lambda value: base64.urlsafe_b64encode(value).decode().rstrip("=")
          record = {
              "admin_user": "compose-ci-admin",
              "admin_password_hash": f"pbkdf2_sha256${rounds}${encode(salt)}${encode(digest)}",
              "api_key": sys.argv[2],
              "agent_api_key": "compose-agent-" + secrets.token_urlsafe(24),
          }
          target = data / "credentials.json"
          target.write_text(json.dumps(record), encoding="utf-8")
          target.chmod(0o600)
          PY
          cd deploy/docker
          docker compose -p "$PROJECT" up -d --build
          ready=0
          for _ in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8080/health >/dev/null \
              && curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:3000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker compose -p "$PROJECT" ps
            docker compose -p "$PROJECT" logs --no-color
            exit 1
          fi
          docker compose -p "$PROJECT" exec -T api python -c "import urllib.request; assert urllib.request.urlopen('http://decision-service:8001/health', timeout=5).status == 200; assert urllib.request.urlopen('http://nad-processor:8002/health', timeout=5).status == 200"
          docker compose -p "$PROJECT" ps
  containment-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated firewall test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables
      - name: Exercise nftables in disposable network namespace
        run: sudo python3 scripts/test_containment_namespace.py
      - name: Exercise iptables fallback in disposable network namespace
        run: sudo env CG_FORCE_IPTABLES=1 python3 scripts/test_containment_namespace.py
