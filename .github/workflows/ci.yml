name: CI
on:
  push:
    branches: [main, "r2-*"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install pytest fastapi uvicorn httpx pydantic jinja2 python-multipart
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r control-plane/api/requirements.txt 2>/dev/null || true
      - name: Assemble + verify gateway
        run: |
          python control-plane/api/assemble_main.py
          test -f control-plane/api/main_full.py
          python -c "import ast; ast.parse(open('control-plane/api/main_full.py').read())"
      - name: Unit tests
        run: python -m pytest tests/ -q --tb=line
      - name: Compile packages
        run: |
          python -m py_compile control-plane/api/main.py agents/linux-ebpf/agent.py agents/linux-ebpf/containment.py agents/linux-ebpf/command_crypto.py dashboard/main.py

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t cyberguardian-api:ci control-plane/api
      - name: Start container smoke
        run: |
          docker run -d --name cg-api -p 18080:8080 cyberguardian-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/health || echo 000)
            if [ "$code" = "200" ]; then echo healthy; exit 0; fi
            sleep 1
          done
          docker logs cg-api || true
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f cg-api || true
